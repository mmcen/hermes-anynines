name: Docker Build & Publish — anynines adaption

on:
  push:
    branches: [main]
    paths:
      - 'docker/entrypoint-anynines.sh'
      - 'docker/s6-rc.d/cloudflared/run'
      - 'Dockerfile.anynines'
      - '.github/workflows/docker-anynines.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: mmcen/hermes-anynines

jobs:
  # ------------------------------------------------------------------
  # Step 1: build the BASE image (stock Dockerfile), pinned by digest.
  # The anynines wrapper (Dockerfile.anynines) consumes this digest via
  # build-arg BASE_IMAGE, so it always wraps the exact base just built.
  # We tag it :base / :base-<sha> — NOT :latest — because :latest is
  # reserved for the ready-to-deploy wrapper (see step 2), avoiding the
  # trap of a "latest" that lacks the anynines entrypoint.
  # ------------------------------------------------------------------
  build-base:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.push-base.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push base image
        id: push-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:base
            ${{ env.IMAGE_NAME }}:base-${{ github.sha }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Step 2: wrap the freshly-pushed base with the anynines entrypoint.
  # Depends on build-base; pins the base by digest so `FROM` never
  # drifts. Tags include :latest = the directly deployable wrapper.
  # ------------------------------------------------------------------
  build-anynines:
    runs-on: ubuntu-latest
    needs: build-base
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push anynines tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.anynines
          push: true
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_NAME }}@${{ needs.build-base.outputs.digest }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:anynines
            ${{ env.IMAGE_NAME }}:anynines-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max