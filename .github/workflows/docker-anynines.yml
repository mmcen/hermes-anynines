name: Docker Build & Publish — anynines adaption

on:
  push:
    branches: [main]
    paths:
      - 'docker/entrypoint-anynines.sh'
      - 'Dockerfile.anynines'
      - '.github/workflows/docker-anynines.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: mmcen/hermes-anynines

jobs:
  build-anynines:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push anynines tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.anynines
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:anynines
            ${{ env.IMAGE_NAME }}:anynines-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max