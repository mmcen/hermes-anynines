name: Docker Build & Publish — anynines adaption

on:
  push:
    branches: [main]
    paths:
      - 'docker/entrypoint-anynines.sh'
      - 'Dockerfile.anynines'
      - '.github/workflows/docker-anynines.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: mmcen/hermes-anynines

jobs:
  # ------------------------------------------------------------------
  # Step 1: build the BASE image (stock Dockerfile) and push :latest.
  # The anynines wrapper (Dockerfile.anynines) does `FROM :latest`,
  # so this must run first. Doing both here makes the workflow
  # self-contained — no need to run docker.yml beforehand.
  # ------------------------------------------------------------------
  build-base:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.push-base.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push base image
        id: push-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:base-${{ github.sha }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Step 2: wrap the freshly-pushed base with the anynines entrypoint.
  # Depends on build-base so `FROM :latest` always resolves.
  # ------------------------------------------------------------------
  build-anynines:
    runs-on: ubuntu-latest
    needs: build-base
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push anynines tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.anynines
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:anynines
            ${{ env.IMAGE_NAME }}:anynines-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
