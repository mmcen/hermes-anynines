name: Docker Build & Publish — slim pure-Telegram

# Slim image for Railway-style single-purpose deployments: Telegram gateway
# only (no dashboard, no node/chromium/ffmpeg, core+telegram venv). See
# Dockerfile.slim for the full cut list. :slim is the deployable wrapper —
# the same anynines entrypoint contract as :latest, on a slim base.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.slim'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docker-slim.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: mmcen/hermes-anynines

jobs:
  # ------------------------------------------------------------------
  # Step 1: build the slim BASE image (Dockerfile.slim), pinned by digest.
  # Tagged :slim-base / :slim-base-<sha> — never :slim, which is reserved
  # for the deployable anynines wrapper (step 2), mirroring the
  # :base/:latest split of the stock workflow.
  # ------------------------------------------------------------------
  build-slim-base:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.push-slim-base.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push slim base image
        id: push-slim-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slim
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:slim-base
            ${{ env.IMAGE_NAME }}:slim-base-${{ github.sha }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Step 2: wrap the freshly-pushed slim base with the anynines entrypoint
  # (same Dockerfile.anynines as the stock pipeline — identical entrypoint,
  # s6 menu and session-env contract), pinned by digest.
  # ------------------------------------------------------------------
  build-slim:
    runs-on: ubuntu-latest
    needs: build-slim-base
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push slim anynines tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.anynines
          push: true
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_NAME }}@${{ needs.build-slim-base.outputs.digest }}
          tags: |
            ${{ env.IMAGE_NAME }}:slim
            ${{ env.IMAGE_NAME }}:slim-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
